<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年度員工聚餐報名表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        /* Custom scrollbar for table */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* Toast animation */
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter {
            animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .toast-exit {
            animation: fadeOut 0.3s ease forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-purple-50 min-h-screen text-slate-800 flex items-center justify-center p-4 sm:p-8">

    <div id="mainContainer" class="w-full max-w-xl bg-white/90 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/60 overflow-hidden transition-all duration-500 relative flex flex-col">
        
        <!-- Header Image / Banner Area -->
        <div class="h-32 bg-gradient-to-r from-indigo-600 to-violet-600 relative flex items-center justify-center overflow-hidden">
            <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
            <div class="relative z-10 text-center">
                <h1 class="text-3xl font-bold text-white tracking-wide flex items-center justify-center gap-3 shadow-sm">
                    <i class="ph ph-fork-knife text-4xl"></i>
                    年度員工聚餐
                </h1>
                <p class="text-indigo-100 mt-2 font-medium tracking-wider text-sm">2026 Company Dinner Event</p>
            </div>
        </div>

        <!-- Custom Tabs -->
        <div class="px-6 pt-6 pb-2">
            <div class="flex p-1.5 bg-slate-100/80 rounded-2xl">
                <button id="tabFormBtn" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition-all duration-300 bg-white text-indigo-600 shadow-sm flex items-center justify-center gap-2">
                    <i class="ph ph-note-pencil text-lg"></i> 報名表單
                </button>
                <button id="tabRecordsBtn" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold transition-all duration-300 text-slate-500 hover:text-slate-700 hover:bg-slate-200/50 flex items-center justify-center gap-2">
                    <i class="ph ph-users text-lg"></i> 報名名單
                </button>
            </div>
        </div>

        <!-- Form Section -->
        <div id="formSection" class="p-6 sm:px-10 pb-10 transition-opacity duration-300">
            <form id="registrationForm" class="space-y-6">
                
                <!-- Input Group: Name -->
                <div class="space-y-1.5">
                    <label for="fullName" class="block text-sm font-semibold text-slate-700">姓名 Full Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="ph ph-user text-xl"></i>
                        </div>
                        <input type="text" id="fullName" required class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white outline-none transition-all duration-200 text-slate-700 placeholder-slate-400" placeholder="請輸入真實姓名">
                    </div>
                </div>

                <!-- Input Group: Department -->
                <div class="space-y-1.5">
                    <label for="department" class="block text-sm font-semibold text-slate-700">所屬部門 Department</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="ph ph-buildings text-xl"></i>
                        </div>
                        <select id="department" required class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white outline-none transition-all duration-200 text-slate-700 appearance-none cursor-pointer">
                            <option value="" disabled selected class="text-slate-400">請選擇部門</option>
                            <option value="管理部">管理部</option>
                            <option value="人資部">人資部</option>
                            <option value="財務部">財務部</option>
                            <option value="資訊部 (IT)">資訊部 (IT)</option>
                            <option value="業務部">業務部</option>
                            <option value="行銷部">行銷部</option>
                            <option value="研發部">研發部</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
                            <i class="ph ph-caret-down text-lg"></i>
                        </div>
                    </div>
                </div>

                <!-- Input Group: Employee ID -->
                <div class="space-y-1.5">
                    <label for="employeeId" class="block text-sm font-semibold text-slate-700">員工編號 Employee ID</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="ph ph-identification-badge text-xl"></i>
                        </div>
                        <input type="text" id="employeeId" required pattern="[a-zA-Z0-9]+" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white outline-none transition-all duration-200 text-slate-700 placeholder-slate-400" placeholder="例如: EMP1234">
                    </div>
                </div>

                <!-- Input Group: Email -->
                <div class="space-y-1.5">
                    <label for="email" class="block text-sm font-semibold text-slate-700">聯絡信箱 Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="ph ph-envelope-simple text-xl"></i>
                        </div>
                        <input type="email" id="email" required class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white outline-none transition-all duration-200 text-slate-700 placeholder-slate-400" placeholder="your.name@company.com">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full relative group overflow-hidden rounded-xl p-[1px] transition-all duration-300">
                        <span class="absolute inset-0 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500 rounded-xl opacity-80 group-hover:opacity-100 transition-opacity duration-300"></span>
                        <div class="relative bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-3.5 px-6 rounded-xl flex items-center justify-center gap-2 transform transition-transform duration-200 shadow-lg group-hover:shadow-indigo-500/30">
                            <i id="submitSpinner" class="ph ph-spinner-gap animate-spin hidden text-xl"></i>
                            <span id="submitBtnText" class="font-bold tracking-wide">確認報名 Submit</span>
                            <i class="ph ph-arrow-right text-lg group-hover:translate-x-1 transition-transform"></i>
                        </div>
                    </button>
                </div>
            </form>
        </div>

        <!-- Records Section (Hidden by default) -->
        <div id="recordsSection" class="hidden p-6 sm:px-10 pb-10 transition-opacity duration-300 flex-col h-[600px] max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="ph ph-clipboard-text text-indigo-600"></i>
                        報名明細表
                    </h2>
                    <p class="text-sm text-slate-500 mt-1">目前共 <span id="totalCount" class="font-bold text-indigo-600 px-1">0</span> 人完成報名</p>
                </div>
                <div class="flex gap-2 sm:gap-3">
                    <button id="refreshDataBtn" class="px-3 sm:px-4 py-2.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 hover:text-indigo-700 rounded-xl font-semibold text-sm transition-colors flex items-center gap-2 border border-indigo-200">
                        <i id="refreshIcon" class="ph ph-arrows-clockwise text-lg"></i>
                        <span class="hidden sm:inline">同步最新資料</span>
                    </button>
                    <button id="downloadCsvBtn" class="px-3 sm:px-4 py-2.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 hover:text-emerald-700 rounded-xl font-semibold text-sm transition-colors flex items-center gap-2 border border-emerald-200">
                        <i class="ph ph-download-simple text-lg"></i>
                        <span class="hidden sm:inline">匯出 CSV</span>
                    </button>
                </div>
            </div>

            <!-- Beautiful Table -->
            <div class="flex-1 overflow-hidden border border-slate-200 rounded-2xl flex flex-col bg-white">
                <div class="overflow-x-auto flex-1 custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">報名時間</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">姓名</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">部門</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">員工編號</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">Email</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTableBody" class="divide-y divide-slate-100">
                            <!-- Data rows will be injected here -->
                            <tr><td colspan="5" class="px-5 py-10 text-center text-slate-400"><i class="ph ph-spinner-gap animate-spin text-2xl mb-2"></i><br>載入中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Footer info -->
        <div class="bg-slate-50/50 p-4 border-t border-slate-100 text-center text-xs text-slate-400 font-medium flex items-center justify-center gap-1.5">
            <i class="ph ph-info text-sm"></i> 有任何問題請聯繫 HR 部門 (#1234)
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 opacity-0 transition-all duration-300">
        <div class="bg-white rounded-[2rem] shadow-2xl p-8 w-full max-w-sm transform scale-95 transition-all duration-300" id="adminModalContent">
            
            <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 mb-6 shadow-sm">
                <i class="ph ph-lock-key text-3xl"></i>
            </div>
            
            <h3 class="text-xl font-bold text-slate-800 mb-2">管理員驗證</h3>
            <p class="text-sm text-slate-500 mb-6">為保護隱私，請輸入管理員專屬編號以查看報名名單。</p>
            
            <div class="space-y-2">
                <div class="relative">
                    <i class="ph ph-password absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                    <input type="password" id="adminIdInput" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white outline-none transition-all duration-200 text-slate-700" placeholder="請輸入編號 (提示: 99999)">
                </div>
                <p id="adminError" class="text-rose-500 text-xs hidden flex items-center gap-1 mt-2">
                    <i class="ph ph-warning-circle"></i> 編號錯誤，請重新輸入
                </p>
            </div>
            
            <div class="flex justify-end gap-3 mt-8">
                <button id="cancelAdminBtn" class="px-5 py-2.5 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors text-sm font-bold cursor-pointer">取消</button>
                <button id="verifyAdminBtn" class="px-5 py-2.5 text-white bg-indigo-600 hover:bg-indigo-700 shadow-lg hover:shadow-indigo-500/30 rounded-xl transition-all text-sm font-bold cursor-pointer">確認驗證</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center pointer-events-none">
        <!-- Toasts injected here -->
    </div>

    <!-- Firebase / Google Sheets Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 🌟 Google Sheets API 設定區 🌟
        const GOOGLE_SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbzsiNZ_UDUTE8zm62Dvbkii-jzHSI2pWM6OjyTMKOsGnQ1iy9HTU3Ck-EHFuYAjrZvA0g/exec'; 
        // ==========================================

        document.addEventListener("DOMContentLoaded", async () => {
            // Environment Variables setup
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-app-id';
            const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

            let db = null;
            let auth = null;
            let app = null;
            let user = null;

            if (firebaseConfigStr) {
                try {
                    const firebaseConfig = JSON.parse(firebaseConfigStr);
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                } catch (e) {
                    console.error("Firebase config parsing error:", e);
                }
            }

            // DOM Elements
            const mainContainer = document.getElementById('mainContainer');
            const tabFormBtn = document.getElementById('tabFormBtn');
            const tabRecordsBtn = document.getElementById('tabRecordsBtn');
            const formSection = document.getElementById('formSection');
            const recordsSection = document.getElementById('recordsSection');
            const form = document.getElementById('registrationForm');
            const submitBtn = document.getElementById('submitBtn');
            const submitSpinner = document.getElementById('submitSpinner');
            const submitBtnText = document.getElementById('submitBtnText');
            const recordsTableBody = document.getElementById('recordsTableBody');
            const totalCount = document.getElementById('totalCount');
            const downloadCsvBtn = document.getElementById('downloadCsvBtn');
            const refreshDataBtn = document.getElementById('refreshDataBtn');
            const refreshIcon = document.getElementById('refreshIcon');
            
            // Admin Modal Elements
            const adminModal = document.getElementById('adminModal');
            const adminModalContent = document.getElementById('adminModalContent');
            const adminIdInput = document.getElementById('adminIdInput');
            const verifyAdminBtn = document.getElementById('verifyAdminBtn');
            const cancelAdminBtn = document.getElementById('cancelAdminBtn');
            const adminError = document.getElementById('adminError');
            const toastContainer = document.getElementById('toastContainer');

            let registrationsData = []; 
            let isAdmin = false;
            let trackingInitialized = false;

            // Beautiful Toast UI
            const showToast = (message, type = 'success') => {
                const toast = document.createElement('div');
                const isSuccess = type === 'success';
                const icon = isSuccess ? '<i class="ph-fill ph-check-circle text-emerald-500 text-xl"></i>' : '<i class="ph-fill ph-warning-circle text-rose-500 text-xl"></i>';
                
                toast.className = `toast-enter flex items-center gap-3 bg-white px-5 py-3.5 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-slate-100 mt-3 pointer-events-auto max-w-sm w-max`;
                toast.innerHTML = `
                    ${icon}
                    <span class="text-sm font-semibold text-slate-700">${message}</span>
                `;
                
                toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.classList.remove('toast-enter');
                    toast.classList.add('toast-exit');
                    setTimeout(() => toast.remove(), 300); // Wait for exit animation
                }, 3000);
            };

            const switchTab = (isForm) => {
                if (isForm) {
                    tabFormBtn.classList.replace('text-slate-500', 'text-indigo-600');
                    tabFormBtn.classList.replace('hover:text-slate-700', 'bg-white');
                    tabFormBtn.classList.add('shadow-sm');
                    tabFormBtn.classList.remove('hover:bg-slate-200/50');
                    
                    tabRecordsBtn.classList.replace('text-indigo-600', 'text-slate-500');
                    tabRecordsBtn.classList.replace('bg-white', 'hover:text-slate-700');
                    tabRecordsBtn.classList.remove('shadow-sm');
                    tabRecordsBtn.classList.add('hover:bg-slate-200/50');

                    formSection.classList.remove('hidden');
                    recordsSection.classList.add('hidden');
                    
                    mainContainer.classList.remove('max-w-4xl');
                    mainContainer.classList.add('max-w-xl');
                } else {
                    tabRecordsBtn.classList.replace('text-slate-500', 'text-indigo-600');
                    tabRecordsBtn.classList.replace('hover:text-slate-700', 'bg-white');
                    tabRecordsBtn.classList.add('shadow-sm');
                    tabRecordsBtn.classList.remove('hover:bg-slate-200/50');
                    
                    tabFormBtn.classList.replace('text-indigo-600', 'text-slate-500');
                    tabFormBtn.classList.replace('bg-white', 'hover:text-slate-700');
                    tabFormBtn.classList.remove('shadow-sm');
                    tabFormBtn.classList.add('hover:bg-slate-200/50');

                    formSection.classList.add('hidden');
                    recordsSection.classList.remove('hidden');
                    
                    mainContainer.classList.remove('max-w-xl');
                    mainContainer.classList.add('max-w-4xl');
                }
            };

            const formatDate = (isoString) => {
                const date = new Date(isoString);
                return date.toLocaleString('zh-TW', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            };

            // 🌟 雙向同步：從 Google Sheets 抓取最新資料 🌟
            const syncWithGoogleSheets = async () => {
                if (!GOOGLE_SHEETS_API_URL || !GOOGLE_SHEETS_API_URL.startsWith('https://script.google.com/')) {
                    showToast('未設定正確 API，目前顯示本機暫存資料', 'error');
                    renderTable(registrationsData);
                    return;
                }

                try {
                    refreshIcon.classList.add('animate-spin');
                    recordsTableBody.innerHTML = `<tr><td colspan="5" class="px-5 py-10 text-center text-slate-400"><i class="ph ph-spinner-gap animate-spin text-2xl mb-2"></i><br>正在從 Google 試算表同步資料...</td></tr>`;
                    
                    const response = await fetch(GOOGLE_SHEETS_API_URL);
                    if (!response.ok) throw new Error('網路連線異常');
                    
                    const data = await response.json();
                    registrationsData = data;
                    // 依據時間由新到舊排序
                    registrationsData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    renderTable(registrationsData);
                    
                } catch (error) {
                    console.error("Google Sheets fetch error:", error);
                    showToast('同步失敗，請確認 Apps Script 權限是否設為「所有人」', 'error');
                    renderTable(registrationsData); // 失敗則顯示舊資料
                } finally {
                    setTimeout(() => refreshIcon.classList.remove('animate-spin'), 500);
                }
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const submitData = {
                    fullName: document.getElementById('fullName').value.trim(),
                    department: document.getElementById('department').value,
                    employeeId: document.getElementById('employeeId').value.trim().toUpperCase(),
                    email: document.getElementById('email').value.trim(),
                    timestamp: new Date().toISOString()
                };

                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
                submitSpinner.classList.remove('hidden');
                submitBtnText.textContent = '處理中...';

                try {
                    if (GOOGLE_SHEETS_API_URL && GOOGLE_SHEETS_API_URL.startsWith('https://script.google.com/')) {
                        // 【方案 A：寫入到 Google Sheets】
                        // 使用 text/plain 避免 CORS preflight 阻擋
                        await fetch(GOOGLE_SHEETS_API_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: {
                                'Content-Type': 'text/plain;charset=utf-8',
                            },
                            body: JSON.stringify(submitData)
                        });
                        
                        // 先將資料推入本地陣列讓畫面提早反應
                        registrationsData.push(submitData);
                        
                        // 若管理員已登入，則在背景延遲 1.5 秒後重新從試算表抓取 (確保資料已完全寫入)
                        if(isAdmin) {
                            setTimeout(() => {
                                syncWithGoogleSheets();
                            }, 1500);
                        }
                    } else {
                        // 離線模擬模式
                        await new Promise(resolve => setTimeout(resolve, 800));
                        registrationsData.push(submitData);
                        registrationsData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                        if(isAdmin) renderTable(registrationsData); 
                    }
                    
                    showToast('🎉 報名成功！期待您的參與！');
                    form.reset();
                } catch (error) {
                    console.error("Error adding document: ", error);
                    showToast('儲存失敗，請稍後再試。', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    submitSpinner.classList.add('hidden');
                    submitBtnText.textContent = '確認報名 Submit';
                }
            });

            const showAdminModal = () => {
                adminModal.classList.remove('hidden');
                setTimeout(() => {
                    adminModal.classList.remove('opacity-0');
                    adminModalContent.classList.remove('scale-95');
                }, 10);
                adminIdInput.value = '';
                adminError.classList.add('hidden');
                adminIdInput.focus();
            };

            const hideAdminModal = () => {
                adminModal.classList.add('opacity-0');
                adminModalContent.classList.add('scale-95');
                setTimeout(() => {
                    adminModal.classList.add('hidden');
                }, 300);
            };

            const verifyAdmin = () => {
                if (adminIdInput.value === '99999') {
                    isAdmin = true;
                    hideAdminModal();
                    switchTab(false);
                    if (!trackingInitialized) {
                        initRealTimeTracking();
                        trackingInitialized = true;
                    }
                } else {
                    adminError.classList.remove('hidden');
                }
            };

            function initRealTimeTracking() {
                if (GOOGLE_SHEETS_API_URL && GOOGLE_SHEETS_API_URL.startsWith('https://script.google.com/')) {
                    // 呼叫雙向同步函式
                    syncWithGoogleSheets();
                } else {
                    showToast('未設定正確 API，顯示本機暫存資料', 'error');
                    renderTable(registrationsData);
                }
            }

            const renderTable = (data) => {
                totalCount.textContent = data.length;
                recordsTableBody.innerHTML = '';

                if (data.length === 0) {
                    recordsTableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-5 py-16 text-center text-slate-400">
                                <i class="ph ph-folder-open text-4xl mb-3 opacity-50"></i>
                                <p>目前尚無報名紀錄</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                data.forEach(record => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-colors duration-150 group';
                    
                    // 處理可能來自 Google Sheets (格式可能稍有不同) 或 Firebase 的日期
                    const dateStr = record.timestamp.includes('T') ? formatDate(record.timestamp) : record.timestamp;

                    tr.innerHTML = `
                        <td class="px-5 py-4 whitespace-nowrap text-sm text-slate-500">${dateStr}</td>
                        <td class="px-5 py-4 whitespace-nowrap text-sm font-bold text-slate-800">${record.fullName}</td>
                        <td class="px-5 py-4 whitespace-nowrap text-sm text-slate-600">
                            <span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md text-xs font-semibold border border-slate-200 group-hover:bg-white transition-colors">${record.department}</span>
                        </td>
                        <td class="px-5 py-4 whitespace-nowrap text-sm font-mono text-slate-500">${record.employeeId}</td>
                        <td class="px-5 py-4 whitespace-nowrap text-sm text-indigo-600 hover:text-indigo-800"><a href="mailto:${record.email}">${record.email}</a></td>
                    `;
                    recordsTableBody.appendChild(tr);
                });
            };

            const downloadCSV = () => {
                if (registrationsData.length === 0) {
                    showToast('目前沒有資料可供下載', 'error');
                    return;
                }

                const headers = ['報名時間', '姓名', '部門', '員工編號', 'Email'];
                const csvRows = [];
                csvRows.push(headers.join(','));

                registrationsData.forEach(row => {
                    const values = [
                        formatDate(row.timestamp),
                        `"${row.fullName}"`,
                        `"${row.department}"`,
                        `"${row.employeeId}"`,
                        `"${row.email}"`
                    ];
                    csvRows.push(values.join(','));
                });

                const BOM = '\uFEFF';
                const csvString = BOM + csvRows.join('\n');
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', `2026_員工聚餐報名名單_${new Date().getTime()}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Event Listeners
            verifyAdminBtn.addEventListener('click', verifyAdmin);
            cancelAdminBtn.addEventListener('click', hideAdminModal);
            adminIdInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') verifyAdmin();
            });

            tabFormBtn.addEventListener('click', () => switchTab(true));
            tabRecordsBtn.addEventListener('click', () => {
                if (isAdmin) {
                    switchTab(false);
                    syncWithGoogleSheets(); // 每次切換到名單頁面，自動同步一次
                } else {
                    showAdminModal();
                }
            });

            downloadCsvBtn.addEventListener('click', downloadCSV);
            refreshDataBtn.addEventListener('click', () => {
                syncWithGoogleSheets();
                showToast('已與 Google 試算表同步完成！');
            });
        });
    </script>
</body>
</html>
